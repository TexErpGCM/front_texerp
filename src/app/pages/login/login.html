<div class="login-container">
  <div class="hero-brand">
    <div class="brand-content">
      <div class="brand-emblem-wrapper">
        <svg class="brand-emblem-svg" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" fill="rgba(255, 255, 255, 0.7)" stroke="#1e40af" stroke-width="2" />
          <circle cx="50" cy="50" r="40" stroke="rgba(30, 64, 175, 0.2)" stroke-width="1.5" stroke-dasharray="4 3" />
          <path d="M 30 28 L 50 72 L 70 28" stroke="#0f2b5c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M 68 22 C 50 36 38 58 58 74" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />
          <circle cx="68" cy="22" r="4" fill="#2563eb" />
        </svg>
      </div>

      <div class="brand-text-block">
        <span class="brand-kicker">SISTEMA ERP TEXTIL</span>
        <h1 class="brand-title">
          <span class="text-light">CREACIONES</span>
          <span class="text-bold">VANNESA</span>
        </h1>
        <div class="brand-line"></div>
        <p class="brand-tagline">Gestión Inteligente de Confección</p>
      </div>
    </div>
  </div>

  <div class="form-wrapper">
    <div class="login-card">
      <div class="card-header">
        <h2>Bienvenido</h2>
        <p>Ingresa a tu cuenta para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-body">
        <div class="input-group">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            formControlName="email" 
            placeholder="Usuario" 
            autocomplete="username" 
          />
        </div>

        <div class="input-group">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            formControlName="password" 
            placeholder="Contraseña" 
            autocomplete="current-password" 
          />
          <button type="button" class="btn-eye" (click)="togglePasswordVisibility()" aria-label="Mostrar u ocultar contraseña">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <div class="options-row">
          <label class="remember-label" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe" formControlName="rememberMe" />
            <span>Recordarme</span>
          </label>
          <a href="javascript:void(0)" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
          Iniciar sesión &rarr;
        </button>
      </form>

      <div class="divider">
        <span>o</span>
      </div>

      <button type="button" class="btn-secondary" (click)="onSubmit()">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Ingresar como administrador
      </button>

      <div class="industry-icons">
        <div class="icon-item" title="Hilos e insumos">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="#0f2b5c" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 2v20M2 12h20"></path>
          </svg>
        </div>
        <div class="icon-item" title="Prendas">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="#0f2b5c" stroke-width="2" fill="none">
            <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10a2 2 0 002 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"></path>
          </svg>
        </div>
        <div class="icon-item" title="Corte">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="#0f2b5c" stroke-width="2" fill="none">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
          </svg>
        </div>
        <div class="icon-item" title="Órdenes de producción">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="#0f2b5c" stroke-width="2" fill="none">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
