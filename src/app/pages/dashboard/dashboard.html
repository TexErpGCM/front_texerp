<main class="dashboard-page">
  <section class="dashboard-card">
    <div class="card-header">
      <div class="brand-badge">TexERP</div>
      <span class="status-pill">
        <span class="status-dot"></span> Autenticación correcta
      </span>
    </div>

    <div class="welcome-section">
      <h1>Bienvenido, <span class="user-name">{{ name || 'Usuario' }}</span></h1>
      <p class="subtitle">
        Flujo de autenticación conectado: sesión, interceptor y guards verificados.
      </p>
    </div>

    <dl class="user-details-grid">
      <div class="detail-item">
        <dt>Correo electrónico</dt>
        <dd>{{ email || 'No informado' }}</dd>
      </div>
      <div class="detail-item">
        <dt>Rol de usuario</dt>
        <dd class="role-tag">{{ role }}</dd>
      </div>
    </dl>

    <button type="button" class="btn-logout" (click)="cerrarSesion()">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Cerrar sesión
    </button>
  </section>
</main>
