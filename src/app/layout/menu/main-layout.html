<div class="app-layout">

  <!-- SIDEBAR LATERAL IZQUIERDO -->
  <aside class="sidebar">

    <!-- LOGO Y MARCA -->
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Creaciones Vanessa</span>
        <span class="brand-subtitle">Textil & Moda Dynamics</span>
      </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="sidebar-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">Dashboard</a>
      <a routerLink="/usuario" routerLinkActive="active" class="menu-item">Usuarios</a>
      <a routerLink="/clientes" routerLinkActive="active" class="menu-item">Clientes</a>
      <a routerLink="/bodegas" routerLinkActive="active" class="menu-item">Bodegas</a>
      <a routerLink="/inventario" routerLinkActive="active" class="menu-item">Inventario</a>
      <a routerLink="/movimientos" routerLinkActive="active" class="menu-item">Movimientos</a>
      <a routerLink="/variante" routerLinkActive="active" class="menu-item">Variante producto</a>
      <a routerLink="/Proveedor" routerLinkActive="active" class="menu-item">Proveedores</a>
    </nav>

    <!-- BOTÓN DE CERRAR SESIÓN -->
    <div class="sidebar-footer">
      <button type="button" class="logout-button" (click)="cerrarSesion()">
        <span>Cerrar sesión</span>
      </button>
    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-wrapper">
    <header class="top-header">
      <div class="header-info">
        <h1>Sistema de Gestión Textil</h1>
        <p>Análisis integral y control operacional</p>
      </div>

      <div class="header-user-panel">
        <div class="user-avatar">CV</div>
        <div class="user-info">
          <span class="user-name">Administrador</span>
          <span class="user-role">Creaciones Vanessa</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
